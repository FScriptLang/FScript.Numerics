name: Prepare Numerics Release
on:
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y libgfortran5
      - name: Validate version and release notes
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          python3 -c 'import os,re; assert re.fullmatch(r"\d+\.\d+\.\d+",os.environ["RELEASE_VERSION"])'
          python3 .github/scripts/notes.py "$RELEASE_VERSION" > "$RUNNER_TEMP/release-notes.md"
      - run: make build test smoke-tests pack package-smoke-tests version=${{ github.ref_name }}
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: |
            .out/packages/*.nupkg
            .out/packages/*.snupkg
